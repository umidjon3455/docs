<!DOCTYPE html>
<html>
<head>
    <title>DevZone Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #111;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 0 20px #00ffcc;
            color: white;
        }
        .btn-custom {
            background: #00ffcc;
            border: none;
        }
        .btn-custom:hover {
            background: #00ccaa;
        }
    </style>
</head>
<body>

<div class="login-box text-center">
    <h3 class="mb-4">💻 DevZone Login</h3>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-custom w-100 mt-2">Kirish</button>
    </form>

    <p class="mt-3">
        Premium olish uchun avval tarif tanlang 🚀
    </p>
</div>

</body>
</html>
